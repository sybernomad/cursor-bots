<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07090f">
  <meta name="description" content="Build a cursor-sized battle robot from frames, wheels, weapons, armor and shields, then fight AI bots in hazard-filled arenas.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cursor Bots">
  <title>Cursor Bots</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="cv" aria-label="Arena"></canvas>
  <div id="bg"></div>

  <main id="app">
    <section id="scr-title" class="screen"></section>
    <section id="scr-hub" class="screen"></section>
    <section id="scr-garage" class="screen"></section>
    <section id="scr-shop" class="screen"></section>
    <section id="scr-vs" class="screen"></section>
    <section id="scr-hud" class="screen hud"></section>
    <section id="scr-result" class="screen"></section>
  </main>

  <div id="sheet" class="sheet hidden"></div>
  <div id="modal" class="modal hidden"></div>
  <div id="coach" class="coach hidden"></div>
  <div id="toast" class="toast"></div>
  <div id="update" class="update hidden"></div>

  <noscript><p style="color:#fff;padding:2rem">Cursor Bots needs JavaScript enabled.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
