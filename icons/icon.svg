<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#14304a"/><stop offset="0.6" stop-color="#0a1220"/><stop offset="1" stop-color="#05070b"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#233246"/><stop offset="1" stop-color="#121a26"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#ff8a3c"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g transform="translate(228 290) rotate(-45)">
    <!-- wheels -->
    <rect x="-70" y="-108" width="64" height="30" rx="10" fill="#15181e" stroke="#3d424d" stroke-width="5"/>
    <rect x="-70" y="78" width="64" height="30" rx="10" fill="#15181e" stroke="#3d424d" stroke-width="5"/>
    <!-- body: cursor arrow -->
    <path d="M150 0 L-105 -110 L-55 0 L-105 110 Z" fill="url(#body)" stroke="#3ff0ff" stroke-width="14" stroke-linejoin="round" filter="url(#glow)"/>
    <path d="M55 0 L15 -18 L15 18 Z" fill="#3ff0ff" filter="url(#glow)"/>
    <!-- spinner blur + bar -->
    <circle cx="160" cy="0" r="62" fill="rgba(255,210,120,0.16)" stroke="rgba(255,226,122,0.55)" stroke-width="4"/>
    <g transform="translate(160 0) rotate(28)">
      <rect x="-62" y="-11" width="124" height="22" rx="6" fill="url(#blade)"/>
      <circle r="11" fill="#1a1e26"/>
    </g>
  </g>
</svg>
